[package]
name = "rofl-x"
version = "0.1.0"
edition = "2021"
description = "Documented parser for League of Legends replay (.rofl) files"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Toastaspiring/RoflParserLeague"
rust-version = "1.75"

[lib]
name = "rofl_x"
path = "src/lib.rs"

[[bin]]
name = "rofl-x"
path = "src/main.rs"

[[bin]]
name = "probe-netid"
path = "src/bin/probe_netid.rs"
required-features = ["emulator"]

[dependencies]
clap = { version = "4", features = ["derive"] }
memchr = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
zstd = "0.13"
zip = "2"

[dependencies.unicorn-engine]
version = "=2.1.1"
optional = true

[features]
default = ["emulator"]
emulator = ["dep:unicorn-engine"]
